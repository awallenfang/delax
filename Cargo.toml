[package]
name = "delax"
version = "0.2.0"
edition = "2024"
authors = ["Ava Wallenfang <ava@wallenfang.de>"]
license = "MIT"
homepage = "https://windsonix.com"
description = "A delay plugin with a few bells and whistles"

[workspace]
members = ["transport","xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nice-plug = { git = "https://codeberg.org/RustAudio/nice-plug.git", default-features = false, features = ["standalone", "editor"], version="0.4.0" }
crossbeam = "0.8.4"
serde = { version = "1.0.228", features = ["derive"] }
slint = { version="1.18.0"}
baseview = { version = "0.3.1", features = ["opengl"]}
rustfft = "6.4.1"
rtrb = "0.4.0"
rand = "0.10.3"
triple_buffer = "9.0.0"
wgpu = {version = "30.0.1", features = ["vulkan-portability"]}
bytemuck = "1.25.2"
pollster = "1.0.1"
rustc-hash = "2.1.3"
syn = "3.0.6"
quote = "1.0.47"
proc-macro2 = "1.0.107"
[dev-dependencies]
serde_json = "1.0"

[build-dependencies]
slint-build = "1.18.0"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
