name: Deploy

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
    # branches: [ "main" ]
permissions:
  contents: write
jobs:
  build-and-upload:
    name: Build and upload
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin

          - build: windows-gnu
            os: windows-latest
            target: x86_64-pc-windows-gnu
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
        else
          echo "VERSION=$(git describe --always --tags)" >> $GITHUB_ENV
        fi
    
    - name: Install Rust
      # Or @nightly if you want
      uses: dtolnay/rust-toolchain@stable
      # Arguments to pass in
      with:
        # Make Rust compile to our target (defined in the matrix)
        targets: ${{ matrix.target }}
    - name: Install Linux dependencies
      if: matrix.build == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libfontconfig1-dev \
          libjack-jackd2-dev \
          pkg-config

    - name: Build
      shell: bash
      run: |
        cargo xtask bundle delax \
          --release \
          --target "${{ matrix.target }}"
    - name: Prepare asset
      shell: bash
      run: |
        asset="Delax-${{ env.VERSION }}-${{ matrix.target }}.clap"
        mv "target/bundled/Delax.clap" "$asset"
        echo "ASSET=$asset" >> $GITHUB_ENV
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: delax-${{ matrix.target }}
        path: ${{ env.ASSET }}
    - name: Upload the binaries
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.ASSET }}
