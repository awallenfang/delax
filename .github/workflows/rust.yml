name: Rust build test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: write
jobs:
  build-and-upload:
    name: Build and upload
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin

          - build: windows-gnu
            os: windows-latest
            target: x86_64-pc-windows-gnu
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
        else
          echo "VERSION=$(git describe --always --tags)" >> $GITHUB_ENV
        fi
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Install Linux dependencies
      if: matrix.build == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libfontconfig1-dev \
          libjack-jackd2-dev \
          pkg-config

    - name: Build
      shell: bash
      run: |
        cargo xtask bundle delax \
          --release \
          --target "${{ matrix.target }}"

    - name: Run tests
      run: cargo test --verbose -- --test-threads=1

