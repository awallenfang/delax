name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libfontconfig1-dev \
          libgl-dev \
          libxcursor-dev \
          libjack-dev \
          libx11-xcb-dev \
          libxcb-dri2-0-dev \
          libxcb-icccm4-dev \
          libvulkan1 \
          mesa-vulkan-drivers \
          vulkan-tools

    - name: Configure headless Vulkan
      run: |
        echo "WGPU_BACKENDS=vulkan" >> "$GITHUB_ENV"
        echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
        vulkaninfo --summary

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose -- --test-threads=1